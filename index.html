<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoe's Pet Clinic</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0a14; overflow: hidden; }
      #game { position: fixed; inset: 0; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #fsbtn {
        position: fixed; right: 8px; bottom: 8px; z-index: 5; font: 12px monospace;
        background: #604a78; color: #fff8ec; border: 2px solid #34263f; padding: 4px 8px; cursor: pointer;
        opacity: 0.55;
      }
      #fsbtn:hover { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <button id="fsbtn" title="Fullscreen (F)">⛶ Fullscreen</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
